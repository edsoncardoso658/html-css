<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de Tabelas Grandes</title>
    <style>

        table{
            width: 400px;
            height: 100px;
            border-collapse: collapse;
            position: relative;
        }
        
        td, th{
            border: 1px solid black;
            padding: 5px;
            text-align: center;
        }

        thead, tfoot{
            background-color: rgba(0, 0, 0, 0.695);
            color: white;

        }
        tbody > tr:nth-child(2n){  /* Linhas Alternativas Coloridas */
            background-color: lightgray;
        }

        /* Para Colocar um Cabeçalho fixo, necessario table ser posicao relativa */
        thead > tr > th{
            position: sticky;
            background-color: rgba(0, 0, 0, 0.695);
            top: -1px;
        }


    </style>
</head>
<body>
    <h1>Uso de Tabelas Grandes</h1>

    <!-- 
    Anatomia para Tabelas Grandes e mesmo para tabelas menores e melhor usar essa anatomia por ser mais semantica.
    TABLE
        CAPTION - Legenda da Tabela
        THEAD
            TR, TD, TH

        TBODY
            TR, TD, TH

        TFOOT
            TR, TD, TH
    -->

    <table>
        <caption>População de Cabo Verde</caption>
        <thead>
            <tr>
                <th scope="col">Ilha</th>
                <th scope="col">Populacao</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Santiago</td>
                <td>150.000</td>
            </tr>

            <tr>
                <td>Santo Antao</td>
                <td>50.000</td>
            </tr>

            <tr>
                <td>Sao Vicente</td>
                <td>80.000</td>
            </tr>

            <tr>
                <td>Sal</td>
                <td>40.0000</td>
            </tr>

            <tr>
                <td>Boavista</td>
                <td>30.000</td>
            </tr>

            <tr>
                <td>Maio</td>
                <td>10.000</td>
            </tr>

            <tr>
                <td>Fogo</td>
                <td>30.000</td>
            </tr>

            <tr>
                <td>Brava</td>
                <td>15.000</td>
            </tr>

            <tr>
                <td>Sao Nicoalu</td>
                <td>25.000</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <th scope="row">Total</th>
                <td>500.000</td>
            </tr>
            
        </tfoot>

    </table>
    
</body>
</html>
