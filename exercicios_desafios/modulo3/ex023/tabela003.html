<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unir Celulas</title>
    <style>
        table{
            width: 300px;
            border-collapse: collapse;
        }

        td{
            padding: 10px;
            text-align: center;
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <h1>Unir Celulas</h1>

    <table>
        <tr>
            <td>A</td>         
            <td>B</td>
            <td>C</td>
        </tr>

        <tr>
            <td>D</td>         
            <td>E</td>
            <td rowspan="2">F</td>
        </tr>

        <tr>
            <td>G</td>         
            <td>H</td>
            
        </tr>

        <tr>
            <td colspan="2">J</td>         
            <td>L</td>

        </tr>


    </table>
    
</body>
</html>
