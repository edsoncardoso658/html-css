<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de varias caixas em Forms</h1>

        <form action="cadastro.php" method="post">
        <p>
            <label for="inome">Nome </label>
            <input type="text" name="user" id="iuser" required minlength="5" maxlength="50" size="50" placeholder="Nome Completo">
        </p>

        <p>
            <label for="imedia">Média </label>
            <input type="number" name="media" id="imedia" min="0" max="20" step="0.5">
        </p>

        <p>
            <label for="ianoletivo"></label>
            <input type="month" name="anoletivo" id="ianoletivo">
        </p>

        <p>
            <label for="idia">Dia do Teste</label>
            <input type="date" name="dia" id="idia"> 
        </p>

        <p>
            <label for="ihora">Hora do Teste</label>
            <input type="time" name="hora" id="ihora">
        </p>

        <p><input type="submit" value="Enviar"></p>
        <p><input type="reset" value="Limpar"></p>

        <!--
        1. Estudar RegEx, form004 foi a base de Expressoes Regulares
        2. Ha varios campos de input para formularios:
        tel (telefone), email, checkbox, radio(radiobutton), color, range (ex: nivel de satisfação), file (para enviar files)
        3.Para radio os botoes devem ter o mesmo name caso sao do mesmo grupo, para poder ser marcado um de cada vez.
        
        -->


    </form>
    
</body>
</html>
